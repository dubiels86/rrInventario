<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario · Partes y Piezas</title>
<style>
  :root {
    --bg:        #0d1117;
    --bg-grid:   #161b22;
    --panel:     #161b22;
    --panel-2:   #1c2331;
    --border:    #30363d;
    --border-2:  #484f58;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --accent:    #ff6b35;
    --accent-2:  #fbbf24;
    --cyan:      #22d3ee;
    --marca:     #60a5fa;
    --nuevo:     #4ade80;
    --uso:       #fbbf24;
    --reparado:  #a78bfa;
    --deterioro: #f87171;
    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ===== HEADER ===== */
  header {
    border: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    padding: 24px 28px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 50%, var(--cyan) 100%);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    letter-spacing: -1px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
  }
  h1 .slash { color: var(--accent); margin: 0 4px; }
  .header-sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .header-sub span::before { content: '> '; color: var(--accent); }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--nuevo);
    margin-right: 6px;
    box-shadow: 0 0 8px var(--nuevo);
    animation: pulse 2s infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== SEARCH BAR ===== */
  .search-bar {
    margin-top: 18px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 16px 12px 42px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    letter-spacing: 0.3px;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,53,.2);
  }
  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 16px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 8px;
    display: none;
  }
  .search-clear:hover { color: var(--accent); border-color: var(--accent); }

  /* ===== CHIP BAR (filtro por ubicación) ===== */
  .chip-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border-2);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all .12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .chip:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .chip.active {
    background: rgba(255,107,53,.18);
    border-color: var(--accent);
    color: var(--accent);
  }
  .chip .chip-count {
    font-size: 10px;
    background: rgba(255,255,255,.08);
    padding: 1px 5px;
    border-radius: 2px;
    color: var(--muted);
  }
  .chip.active .chip-count {
    background: rgba(255,107,53,.25);
    color: var(--accent);
  }

  /* ===== STATS ===== */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 18px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-2);
    padding: 14px 16px;
  }
  .stat.total    { border-left-color: var(--accent); }
  .stat.nuevo    { border-left-color: var(--nuevo); }
  .stat.reparado { border-left-color: var(--reparado); }
  .stat.uso      { border-left-color: var(--uso); }
  .stat.det      { border-left-color: var(--deterioro); }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 4px;
    color: var(--text);
  }
  .stat.total    .stat-value { color: var(--accent); }
  .stat.nuevo    .stat-value { color: var(--nuevo); }
  .stat.reparado .stat-value { color: var(--reparado); }
  .stat.uso      .stat-value { color: var(--uso); }
  .stat.det      .stat-value { color: var(--deterioro); }

  /* ===== GROUPS ===== */
  .group {
    margin-top: 28px;
    border: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
  }
  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .group-title .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .group.nuevo    .group-title { color: var(--nuevo); }
  .group.nuevo    .dot          { background: var(--nuevo); box-shadow: 0 0 10px var(--nuevo); }
  .group.reparado .group-title { color: var(--reparado); }
  .group.reparado .dot          { background: var(--reparado); box-shadow: 0 0 10px var(--reparado); }
  .group.uso      .group-title { color: var(--uso); }
  .group.uso      .dot          { background: var(--uso); box-shadow: 0 0 10px var(--uso); }
  .group.det      .group-title { color: var(--deterioro); }
  .group.det      .dot          { background: var(--deterioro); box-shadow: 0 0 10px var(--deterioro); }
  .group-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .group-count strong { color: var(--text); font-size: 13px; }

  .group-body { padding: 8px; }

  /* ===== ITEMS ===== */
  .item {
    display: grid;
    grid-template-columns: 36px 1fr auto auto auto auto auto;
    gap: 14px;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    transition: background .12s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--panel-2); }
  .item-icon {
    font-size: 22px;
    text-align: center;
    filter: saturate(1.1);
  }
  .item-name {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }
  .item-name .desc {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .item-code {
    font-size: 11px;
    color: var(--cyan);
    background: rgba(34,211,238,.15);
    border: 1px solid rgba(34,211,238,.35);
    padding: 3px 8px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    min-width: 90px;
    text-align: center;
  }
  .item-code.empty {
    color: var(--muted);
    border-color: var(--border);
    background: transparent;
  }
  .item-cat {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
    min-width: 90px;
    text-align: right;
  }
  .item-ubic {
    font-size: 11px;
    color: var(--accent);
    background: rgba(255,107,53,.15);
    border: 1px solid rgba(255,107,53,.35);
    padding: 3px 8px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    min-width: 92px;
    text-align: center;
  }
  .item-ubic.empty {
    color: var(--muted);
    border-color: var(--border);
    background: transparent;
  }
  .item-marca {
    font-size: 11px;
    color: var(--marca);
    background: rgba(96,165,250,.15);
    border: 1px solid rgba(96,165,250,.35);
    padding: 3px 8px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    min-width: 88px;
    text-align: center;
  }
  .item-marca.empty {
    color: var(--muted);
    border-color: var(--border);
    background: transparent;
  }
  .item-qty {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    min-width: 48px;
    text-align: right;
    letter-spacing: 0.5px;
  }
  .item-qty .x { color: var(--muted); font-weight: 400; font-size: 12px; margin-right: 2px; }

  /* Empty state */
  .empty-state {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .empty-state::before { content: '⚠ '; color: var(--accent); }

  /* ===== FOOTER ===== */
  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px dashed var(--border);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    letter-spacing: 0.5px;
  }
  footer a { color: var(--cyan); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 720px) {
    .container { padding: 18px 12px 60px; }
    h1 { font-size: 17px; }
    .logo { font-size: 22px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 22px; }
    .item {
      grid-template-columns: 32px 1fr auto;
      gap: 10px;
      padding: 10px 12px;
    }
    .item-code, .item-marca, .item-cat, .item-ubic { display: none; }
    .item-name .desc::before { content: '· '; }
  }
</style>
</head>

const ESTADOS = [
  { key: 'nuevo',       label: 'Nuevos',       clase: 'nuevo'    },
  { key: 'reparado',    label: 'Reparados',    clase: 'reparado' },
  { key: 'uso',         label: 'En Uso',       clase: 'uso'      },
  { key: 'deteriorado', label: 'Deteriorados', clase: 'det'      }
];

const estadoTexto = {
  'nuevo':       'nuevo',
  'reparado':    'reparado',
  'uso':         'uso',
  'deteriorado': 'deteriorado'
};

/* ===== Render ===== */
function render(filtro = '', ubicFiltro = null) {
  const q = filtro.trim().toLowerCase();
  const qNorm = q.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const groupsEl = document.getElementById('groups');

  // Totales globales (siempre sobre el inventario completo)
  let total = 0, tn = 0, tr = 0, tu = 0, td = 0;
  INVENTARIO.forEach(it => {
    total += it.cantidad;
    if (it.estado === 'nuevo')            tn += it.cantidad;
    else if (it.estado === 'reparado')    tr += it.cantidad;
    else if (it.estado === 'uso')         tu += it.cantidad;
    else if (it.estado === 'deteriorado') td += it.cantidad;
  });
  document.getElementById('t-total').textContent = total;
  document.getElementById('t-nuevo').textContent = tn;
  document.getElementById('t-rep').textContent   = tr;
  document.getElementById('t-uso').textContent   = tu;
  document.getElementById('t-det').textContent   = td;

  let html = '';
  ESTADOS.forEach(est => {
    const items = INVENTARIO.filter(it => {
      if (it.estado !== est.key) return false;
      if (ubicFiltro) {
        if (ubicFiltro === '__sin__') {
          if (it.ubicacion) return false;
        } else if (it.ubicacion !== ubicFiltro) {
          return false;
        }
      }
      if (!q) return true;
      const texto = (it.nombre + ' ' + it.codigo + ' ' + (it.marca || '') + ' ' + it.categoria + ' ' + (it.ubicacion || '') + ' ' + estadoTexto[it.estado]).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      return texto.includes(qNorm);
    });

    const totalGrupo = items.reduce((s, it) => s + it.cantidad, 0);

    html += `
      <div class="group ${est.clase}">
        <div class="group-header">
          <div class="group-title"><span class="dot"></span>${est.label}</div>
          <div class="group-count"><strong>${items.length}</strong> ítem(s) · <strong>${totalGrupo}</strong> pieza(s)</div>
        </div>
        <div class="group-body">
    `;

    if (items.length === 0) {
      html += `<div class="empty-state">Sin resultados en este grupo${q ? ' para "' + escapeHtml(q) + '"' : ''}.</div>`;
    } else {
      items.forEach(it => {
        const codigoHTML = it.codigo
          ? `<span class="item-code">${escapeHtml(it.codigo)}</span>`
          : `<span class="item-code empty">—</span>`;
        const marcaHTML = it.marca
          ? `<span class="item-marca">${escapeHtml(it.marca)}</span>`
          : `<span class="item-marca empty">—</span>`;
        const ubicHTML = it.ubicacion
          ? `<span class="item-ubic">${escapeHtml(it.ubicacion)}</span>`
          : `<span class="item-ubic empty">—</span>`;
        const descParts = [it.categoria];
        if (it.marca) descParts.push(it.marca);
        if (it.ubicacion) descParts.push(it.ubicacion);
        const descText = descParts.join(' · ');
        html += `
          <div class="item">
            <div class="item-icon">${it.icono}</div>
            <div class="item-name">
              ${escapeHtml(it.nombre)}
              <span class="desc">${escapeHtml(descText)}</span>
            </div>
            ${codigoHTML}
            ${marcaHTML}
            <div class="item-cat">${escapeHtml(it.categoria)}</div>
            ${ubicHTML}
            <div class="item-qty"><span class="x">×</span>${it.cantidad}</div>
          </div>
        `;
      });
    }

    html += `</div></div>`;
  });

  groupsEl.innerHTML = html;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ===== Fecha ===== */
function setFecha() {
  const ahora = new Date();
  const opts = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
  const txt = ahora.toLocaleString('es-ES', opts).replace(',', ' ·');
  document.getElementById('fecha').textContent = 'ACTUALIZADO: ' + txt.toUpperCase();
  document.getElementById('gen').textContent = 'Generado: ' + txt;
}

/* ===== Eventos ===== */
const search = document.getElementById('search');
const clear  = document.getElementById('clear');

let activeUbic = null; // null = todas

search.addEventListener('input', e => {
  const v = e.target.value;
  clear.style.display = v ? 'block' : 'none';
  render(v, activeUbic);
});

clear.addEventListener('click', () => {
  search.value = '';
  clear.style.display = 'none';
  search.focus();
  render('', activeUbic);
});

/* Chip: clic para filtrar por ubicación */
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeUbic = chip.dataset.ubic || null;
  renderChips();
  render(search.value, activeUbic);
});

/* Atajo: tecla "/" enfoca la búsqueda */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search) {
    e.preventDefault();
    search.focus();
  }
  if (e.key === 'Escape' && document.activeElement === search) {
    search.value = '';
    clear.style.display = 'none';
    activeUbic = null;
    renderChips();
    render('');
    search.blur();
  }
});

/* ===== Render de chips de ubicación ===== */
function renderChips() {
  const chipsEl = document.getElementById('chips');
  const ubs = [...new Set(INVENTARIO.map(it => it.ubicacion).filter(u => u))];
  const counts = {};
  ubs.forEach(u => { counts[u] = INVENTARIO.filter(it => it.ubicacion === u).length; });
  const sinUbic = INVENTARIO.filter(it => !it.ubicacion).length;

  let html = `<button class="chip${activeUbic === null ? ' active' : ''}" data-ubic="">Todas <span class="chip-count">${INVENTARIO.length}</span></button>`;
  ubs.forEach(u => {
    html += `<button class="chip${activeUbic === u ? ' active' : ''}" data-ubic="${escapeHtml(u)}">${escapeHtml(u)} <span class="chip-count">${counts[u]}</span></button>`;
  });
  if (sinUbic > 0) {
    html += `<button class="chip${activeUbic === '__sin__' ? ' active' : ''}" data-ubic="__sin__">Sin ubicar <span class="chip-count">${sinUbic}</span></button>`;
  }
  chipsEl.innerHTML = html;
}

/* ===== Init ===== */
setFecha();
renderChips();
render();
</script>
